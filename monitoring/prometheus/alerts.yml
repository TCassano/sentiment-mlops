groups:
  # --- Service health --------------------------------------------------------
  - name: sentiment-service
    rules:
      - alert: SentimentApiDown
        expr: up{job="sentiment-api"} == 0 or sentiment_model_loaded == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sentiment API down or model not loaded"

      - alert: SentimentHighErrorRate
        expr: |
          sum(rate(sentiment_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(sentiment_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of requests fail with 5xx"

      - alert: SentimentHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(sentiment_http_request_duration_seconds_bucket{endpoint=~"/predict.*"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 prediction latency above 1s"

  # --- Model / data drift proxies (no ground truth needed) -------------------
  - name: sentiment-drift
    rules:
      - alert: SentimentLowConfidenceShare
        expr: |
          sum(rate(sentiment_low_confidence_predictions_total[1h]))
            / clamp_min(sum(rate(sentiment_predictions_total[1h])), 1e-9) > 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than 15% of predictions have confidence < 0.5 (~4x the reference baseline of 4%)"

      - alert: SentimentSocialMarkerShift
        # Share of texts with mentions / links / hashtags vs the 7-day baseline: the most
        # discriminative data-drift signal measured offline (non-social text -> share drops to 0).
        expr: |
          abs(
            sum by (marker) (rate(sentiment_input_markers_total[1h]))
              / scalar(clamp_min(sum(rate(sentiment_predictions_total[1h])), 1e-9))
            -
            sum by (marker) (rate(sentiment_input_markers_total[7d]))
              / scalar(clamp_min(sum(rate(sentiment_predictions_total[7d])), 1e-9))
          ) > 0.15
          and on() sum(increase(sentiment_predictions_total[1h])) > 100
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Share of texts with {{ $labels.marker }} moved by more than 15 points vs the weekly baseline"

      - alert: SentimentNegativeShareSpike
        # Negative share in the last hour vs the 7-day baseline: the "tone change" signal.
        expr: |
          (
            sum(rate(sentiment_predictions_total{label="negative"}[1h]))
              / clamp_min(sum(rate(sentiment_predictions_total[1h])), 1e-9)
          ) > 1.5 * (
            sum(rate(sentiment_predictions_total{label="negative"}[7d]))
              / clamp_min(sum(rate(sentiment_predictions_total[7d])), 1e-9)
          )
          and sum(increase(sentiment_predictions_total[1h])) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Negative share is 1.5x the weekly baseline"

      - alert: SentimentInputLengthShift
        expr: |
          histogram_quantile(0.5, sum by (le) (rate(sentiment_input_text_length_chars_bucket[1h])))
            > 2 * histogram_quantile(0.5, sum by (le) (rate(sentiment_input_text_length_chars_bucket[7d])))
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Median input length doubled vs weekly baseline (new source / format?)"
